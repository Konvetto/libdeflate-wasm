name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm size

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the native reference compressor from vendor/ (byte-for-byte tests)
        if: matrix.node != 20
        run: ./scripts/build-native-gzip.sh
      # vitest 5 needs Node 22; on Node 20 the job checks the built package only (smoke test below).
      - run: pnpm test:coverage
        if: matrix.node != 20
      - name: Smoke-test the built package in plain Node
        run: |
          pnpm build
          node --input-type=module -e "
            import { init, zlib, unzlib } from './dist/index.js';
            await init();
            const data = new TextEncoder().encode('hello hello hello hello '.repeat(1000));
            const z = zlib(data, 12);
            if (z[0] !== 0x78 || unzlib(z).length !== data.length) throw new Error('bad output');
            console.log('ok', z.length, 'bytes');
          "

  wasm:
    # Checks that vendor/ is the pinned libdeflate release and rebuilds the wasm with emsdk 7.0.1.
    # The committed file is built with Homebrew's Emscripten 7.0.1 on macOS; a Linux emsdk build
    # of the same version may differ in bytes (different LLVM build), so a mismatch is reported
    # as a warning, not a failure. Output equality with native libdeflate is what the tests pin.
    name: Verify vendor and rebuild wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: vendor/libdeflate matches the pinned release tarball (SHA-256)
        run: ./scripts/fetch-libdeflate.sh --verify
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.1
          actions-cache-folder: emsdk-cache
      - run: emcc --version
      - name: Rebuild and compare with the committed wasm
        run: |
          OUT="$RUNNER_TEMP/libdeflate.wasm" ./scripts/build-wasm.sh
          committed=$(sha256sum src/libdeflate.wasm | cut -d' ' -f1)
          rebuilt=$(sha256sum "$RUNNER_TEMP/libdeflate.wasm" | cut -d' ' -f1)
          echo "committed $committed"
          echo "rebuilt   $rebuilt"
          if [ "$committed" != "$rebuilt" ]; then
            echo "::warning title=wasm differs::The emsdk 7.0.1 rebuild differs from src/libdeflate.wasm ($rebuilt vs $committed). See CONTRIBUTING.md."
          fi
