name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm size

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Smoke-test the built package in plain Node
        run: |
          pnpm build
          node --input-type=module -e "
            import { init, zlib, unzlib } from './dist/index.js';
            await init();
            const data = new TextEncoder().encode('hello hello hello hello '.repeat(1000));
            const z = zlib(data, 12);
            if (z[0] !== 0x78 || unzlib(z).length !== data.length) throw new Error('bad output');
            console.log('ok', z.length, 'bytes');
          "

  wasm:
    name: Rebuild wasm from vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.1
      - run: ./scripts/build-wasm.sh
      - name: The committed wasm matches the vendored source
        run: git diff --exit-code --stat src/libdeflate.wasm
